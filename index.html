<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <meta name="theme-color" content="#111111" />
    <title>Circuit Bored</title>
    <style>
      :root {
        color-scheme: dark;
        --bg-deep: #060810;
        --bg-base: #0a0d12;
        --panel: #11151c;
        --panel-2: #161c25;
        --line: #1f2630;
        --cyan: #5ad6ff;
        --cyan-soft: rgba(90, 214, 255, 0.45);
        --cyan-glow: rgba(90, 214, 255, 0.18);
        --amber: #ffd166;
        --amber-soft: rgba(255, 209, 102, 0.40);
        --magenta: #ff4ad6;
        --red: #ff5a5a;
        --red-glow: rgba(255, 90, 90, 0.45);
        --text: #eaf0f8;
        --text-dim: #8a96a6;
        --text-disabled: #4a5260;
      }
      html, body {
        margin: 0;
        padding: 0;
        background:
          linear-gradient(rgba(90, 214, 255, 0.022) 1px, transparent 1px),
          linear-gradient(90deg, rgba(90, 214, 255, 0.018) 1px, transparent 1px),
          radial-gradient(circle at 50% 0%, #111f2d 0%, var(--bg-base) 42%, var(--bg-deep) 100%);
        background-size: 28px 28px, 28px 28px, auto;
        color: var(--text);
        font-family: -apple-system, system-ui, sans-serif;
        overscroll-behavior: none;
        touch-action: manipulation;
        -webkit-user-select: none;
        user-select: none;
        min-height: 100vh;
      }
      #app {
        display: flex;
        flex-direction: column;
        align-items: stretch;
        max-width: 480px;
        margin: 0 auto;
        min-height: 100vh;
        background: rgba(5, 9, 14, 0.38);
        box-shadow: 0 0 80px rgba(0, 0, 0, 0.42);
      }
      #topbar {
        display: flex;
        gap: 8px;
        padding: 10px 10px 8px;
        align-items: center;
        background: linear-gradient(180deg, rgba(17, 21, 28, 0.95), rgba(10, 13, 18, 0.95));
        border-bottom: 1px solid var(--cyan-soft);
        box-shadow: 0 1px 0 var(--cyan-glow);
        flex-wrap: wrap;
      }
      #topbar .mode {
        font-weight: 700;
        font-size: 12px;
        letter-spacing: 0.22em;
        text-transform: uppercase;
        color: var(--cyan);
        flex: 1;
      }
      #seed-label {
        color: var(--text-dim);
        font: 600 10px ui-monospace, SFMono-Regular, Menlo, monospace;
        letter-spacing: 0.08em;
      }
      #screen {
        display: flex;
        flex-direction: column;
        gap: 14px;
        padding: 18px 14px 28px;
      }
      .screen-kicker {
        color: var(--cyan);
        font-size: 11px;
        font-weight: 800;
        letter-spacing: 0.22em;
        text-transform: uppercase;
      }
      .screen-title {
        margin: 0;
        font-size: clamp(28px, 9vw, 46px);
        line-height: 0.95;
        letter-spacing: 0.06em;
        text-transform: uppercase;
      }
      .screen-copy {
        margin: 0;
        color: var(--text-dim);
        font-size: 13px;
        line-height: 1.55;
      }
      .panel {
        padding: 14px;
        border: 1px solid var(--line);
        border-left-color: var(--cyan-soft);
        background: linear-gradient(135deg, rgba(22, 28, 37, 0.94), rgba(11, 15, 21, 0.96));
        box-shadow:
          inset 0 1px 0 rgba(255,255,255,.025),
          inset 0 0 24px rgba(90, 214, 255, 0.025),
          0 12px 28px rgba(0,0,0,.16);
      }
      .panel h2, .panel h3 { margin: 0 0 8px; }
      .panel p { margin: 0; }
      .action-stack { display: grid; gap: 8px; }
      .action-stack button { width: 100%; min-height: 46px; text-align: left; }
      .seed-row { display: grid; grid-template-columns: 1fr auto; gap: 8px; }
      input {
        min-width: 0;
        padding: 10px;
        color: var(--text);
        background: #080b10;
        border: 1px solid var(--line);
        border-radius: 3px;
        font: 600 13px ui-monospace, SFMono-Regular, Menlo, monospace;
        text-transform: uppercase;
      }
      input:focus { outline: 1px solid var(--cyan); border-color: var(--cyan); }
      .squad-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 7px; }
      .squad-card {
        padding: 9px 7px;
        border: 1px solid var(--line);
        background: rgba(7, 11, 16, 0.7);
      }
      .squad-card.dead { opacity: 0.42; border-color: var(--red); }
      .squad-name { color: var(--cyan); font-size: 11px; font-weight: 800; letter-spacing: 0.08em; text-transform: uppercase; }
      .health-track { height: 4px; margin: 7px 0 5px; background: #252a32; overflow: hidden; }
      .health-fill { height: 100%; background: linear-gradient(90deg, var(--red), var(--amber), var(--cyan)); }
      .micro { color: var(--text-dim); font-size: 10px; line-height: 1.35; }
      .route { display: grid; grid-template-columns: repeat(7, minmax(72px, 1fr)); gap: 6px; overflow-x: auto; padding-bottom: 8px; }
      .route-column { display: flex; min-width: 76px; flex-direction: column; gap: 6px; }
      .route-depth { color: var(--text-dim); font-size: 9px; letter-spacing: 0.1em; text-align: center; }
      .route-node {
        min-height: 80px;
        padding: 8px 6px;
        white-space: normal;
        text-align: center;
        line-height: 1.25;
      }
      .route-node small { display: block; margin-top: 4px; color: var(--text-dim); font-size: 8px; letter-spacing: 0.02em; text-transform: none; }
      .route-node.current { border-color: var(--cyan); box-shadow: 0 0 12px var(--cyan-glow); }
      .route-node.chosen { border-color: var(--amber); color: var(--amber); }
      .route-node.skipped { opacity: 0.25; }
      .route-node.elite, .route-node.final { border-color: var(--red); }
      .choice-grid { display: grid; gap: 8px; }
      .choice-card { padding: 14px; min-height: 112px; white-space: normal; text-align: left; }
      .choice-card strong { display: block; margin-bottom: 6px; color: var(--cyan); font-size: 14px; }
      .choice-card span { color: var(--text-dim); font-size: 11px; line-height: 1.45; text-transform: none; letter-spacing: 0.02em; }
      .tag { display: inline-block; margin-top: 9px; color: var(--amber); font-size: 9px; letter-spacing: 0.12em; text-transform: uppercase; }
      .upgrade-list { display: flex; flex-wrap: wrap; gap: 5px; }
      .upgrade-chip { padding: 4px 6px; border: 1px solid var(--line); color: var(--text-dim); font-size: 9px; }
      .stat-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 8px; }
      .stat { padding: 12px; background: rgba(0,0,0,.2); border: 1px solid var(--line); }
      .stat strong { display: block; color: var(--cyan); font-size: 22px; }
      .warning { color: var(--red); font-size: 12px; }
      #canvas-wrap {
        position: relative;
        width: 100%;
        isolation: isolate;
        overflow: auto;
        overscroll-behavior: contain;
        background: #060a0f;
      }
      #canvas-wrap::after {
        content: "";
        position: absolute;
        inset: 0;
        z-index: 1;
        pointer-events: none;
        background:
          linear-gradient(90deg, rgba(69,216,232,.08), transparent 4%, transparent 96%, rgba(255,66,109,.07)),
          radial-gradient(circle at 50% 48%, transparent 55%, rgba(0,0,0,.32) 100%);
        box-shadow: inset 0 0 24px rgba(0,0,0,.45);
      }
      #board-shell {
        border-left: 1px solid rgba(90,214,255,.16);
        border-right: 1px solid rgba(90,214,255,.16);
        box-shadow: 0 24px 70px rgba(0,0,0,.48);
      }
      canvas {
        display: block;
        width: 100%;
        height: auto;
        background: var(--bg-base);
        box-shadow: 0 0 0 1px var(--line), inset 0 0 24px rgba(0, 0, 0, 0.6);
        filter: saturate(1.08) contrast(1.035);
        touch-action: pan-x pan-y;
      }
      #hud {
        padding: 10px;
        background: linear-gradient(180deg, rgba(17, 21, 28, 0.96), rgba(10, 13, 18, 0.98));
        border-top: 1px solid var(--cyan-soft);
        box-shadow: 0 -1px 0 var(--cyan-glow);
        display: flex;
        flex-direction: column;
        gap: 8px;
        position: relative;
      }
      #hud::before {
        content: "";
        position: absolute;
        inset: 0;
        pointer-events: none;
        background: repeating-linear-gradient(
          180deg,
          rgba(255, 255, 255, 0.025) 0 1px,
          transparent 1px 3px
        );
        mix-blend-mode: screen;
        opacity: 0.5;
      }
      .row {
        display: flex;
        gap: 6px;
        flex-wrap: wrap;
        align-items: center;
        position: relative;
      }
      button {
        background: linear-gradient(180deg, var(--panel-2), var(--panel));
        color: var(--text);
        border: 1px solid var(--line);
        padding: 8px 12px;
        font-size: 12px;
        font-weight: 600;
        letter-spacing: 0.08em;
        text-transform: uppercase;
        border-radius: 3px;
        cursor: pointer;
        transition: border-color 0.12s ease, box-shadow 0.12s ease, background 0.12s ease, color 0.12s ease;
      }
      button:hover {
        border-color: var(--cyan-soft);
        box-shadow: 0 0 0 1px var(--cyan-glow), inset 0 0 8px var(--cyan-glow);
      }
      button:active {
        background: var(--panel);
        transform: translateY(1px);
      }
      button.active {
        border-color: var(--cyan);
        color: var(--cyan);
        box-shadow: inset 0 0 10px var(--cyan-glow);
      }
      button.primary {
        border-color: var(--cyan);
        color: var(--cyan);
      }
      button.primary:hover {
        box-shadow: 0 0 0 1px var(--cyan-soft), inset 0 0 12px var(--cyan-glow);
      }
      button.danger {
        border-color: var(--red);
        color: var(--red);
      }
      button.danger:hover {
        box-shadow: 0 0 0 1px var(--red-glow), inset 0 0 12px var(--red-glow);
      }
      button:disabled {
        color: var(--text-disabled);
        border-color: var(--line);
        filter: saturate(0.4);
        cursor: default;
        box-shadow: none;
      }
      .status {
        font-size: 12px;
        color: var(--text-dim);
        letter-spacing: 0.04em;
        position: relative;
      }
      .overlay {
        position: absolute;
        inset: 0;
        background: radial-gradient(circle at 50% 50%, rgba(8, 12, 18, 0.85), rgba(0, 0, 0, 0.92));
        backdrop-filter: blur(2px);
        -webkit-backdrop-filter: blur(2px);
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 18px;
        color: var(--text);
        z-index: 3;
      }
      .overlay h2 {
        margin: 0;
        font-size: 36px;
        font-weight: 800;
        letter-spacing: 0.20em;
        text-transform: uppercase;
        color: var(--cyan);
        text-shadow:
          0 0 6px var(--cyan-soft),
          0 0 18px var(--cyan-glow),
          0 2px 0 rgba(0, 0, 0, 0.7);
      }
      .overlay.victory h2 {
        color: var(--cyan);
        text-shadow:
          0 0 6px var(--cyan-soft),
          0 0 22px rgba(255, 209, 102, 0.40),
          0 0 36px rgba(90, 214, 255, 0.30),
          0 2px 0 rgba(0, 0, 0, 0.7);
      }
      .overlay.defeat h2 {
        color: var(--red);
        text-shadow:
          1px 0 0 var(--magenta),
          -1px 0 0 var(--red),
          0 0 12px rgba(255, 90, 90, 0.55),
          0 0 28px rgba(255, 74, 214, 0.35);
      }
      .turn-banner {
        position: absolute;
        inset: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 44px;
        font-weight: 800;
        letter-spacing: 0.22em;
        text-transform: uppercase;
        color: var(--text);
        background: rgba(0, 0, 0, 0.55);
        pointer-events: none;
        opacity: 1;
        transition: opacity 0.6s ease-out;
        overflow: hidden;
        z-index: 4;
      }
      .turn-banner::after {
        content: "";
        position: absolute;
        inset: 0;
        pointer-events: none;
        background: repeating-linear-gradient(
          180deg,
          rgba(255, 255, 255, 0.05) 0 1px,
          transparent 1px 3px
        );
        mix-blend-mode: overlay;
      }
      .turn-banner.fade { opacity: 0; }
      .turn-banner.your-turn {
        color: var(--cyan);
        text-shadow:
          0 0 4px rgba(90, 214, 255, 0.9),
          0 0 12px rgba(90, 214, 255, 0.6),
          0 0 28px rgba(90, 214, 255, 0.35),
          0 2px 0 rgba(0, 0, 0, 0.7);
      }
      .turn-banner.enemy-turn {
        color: var(--red);
        text-shadow:
          0 0 4px rgba(255, 90, 90, 0.9),
          0 0 12px rgba(255, 90, 90, 0.55),
          0 0 28px rgba(255, 90, 90, 0.30),
          0 2px 0 rgba(0, 0, 0, 0.7);
      }
      @keyframes pulse-attention {
        0%, 100% {
          box-shadow: 0 0 0 0 rgba(90, 214, 255, 0.7);
        }
        50% {
          box-shadow: 0 0 0 6px rgba(90, 214, 255, 0);
        }
      }
      button.pulse-attention {
        animation: pulse-attention 1.4s ease-in-out infinite;
        border-color: var(--cyan);
        color: var(--cyan);
      }
      .hidden { display: none !important; }
    </style>
  </head>
  <body>
    <div id="app">
      <div id="topbar">
        <div class="mode" id="mode-label">Editor</div>
        <div id="seed-label"></div>
        <button id="screenshot">Shot</button>
        <button id="mode-toggle">Title</button>
      </div>
      <main id="screen"></main>
      <div id="board-shell" class="hidden">
        <div id="canvas-wrap">
          <canvas id="canvas" width="384" height="384"></canvas>
          <div id="overlay" class="overlay hidden">
            <h2 id="overlay-text">VICTORY</h2>
            <button id="overlay-button" class="primary">Continue</button>
          </div>
          <div id="turn-banner" class="turn-banner hidden"></div>
        </div>
        <div id="hud"></div>
      </div>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
